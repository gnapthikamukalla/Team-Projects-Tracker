<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Team Project Tracker</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f4f6f9;
    color: #172033;
}

button,
select,
input,
textarea {
    font-family: inherit;
}

button {
    cursor: pointer;
}

.header {
    background: white;
    border-bottom: 1px solid #e3e7ed;
    padding: 16px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 20;
}

.header h1 {
    margin: 0;
    font-size: 22px;
}

.header-right {
    display: flex;
    gap: 8px;
    align-items: center;
}

.container {
    max-width: 1500px;
    margin: auto;
    padding: 24px;
}

button.primary {
    background: #315efb;
    color: white;
    border: none;
    border-radius: 7px;
    padding: 10px 16px;
}

button.secondary {
    background: #eef2ff;
    color: #315efb;
    border: none;
    border-radius: 7px;
    padding: 9px 14px;
}

button.danger {
    background: #ffe1e1;
    color: #b42318;
    border: none;
    border-radius: 7px;
    padding: 9px 14px;
}

button.green {
    background: #dff6e8;
    color: #137333;
    border: none;
    border-radius: 7px;
    padding: 9px 14px;
}

.dashboard {
    display: grid;
    grid-template-columns: 1fr;
    gap: 18px;
    margin-bottom: 25px;
}

.dashboard-card {
    background: white;
    border: 1px solid #e1e5eb;
    border-radius: 12px;
    padding: 18px;
}

.dashboard-card h2 {
    margin: 0 0 15px;
    font-size: 18px;
}

.stats-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
}

.stat-card {
    background: #f8fafc;
    border: 1px solid #e3e7ed;
    border-radius: 10px;
    padding: 15px;
}

.stat-title {
    color: #64748b;
    font-size: 13px;
}

.stat-number {
    font-size: 27px;
    font-weight: bold;
    margin-top: 5px;
}

.person-dashboard {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 12px;
}

.person-card {
    border: 1px solid #dfe4eb;
    border-radius: 10px;
    padding: 15px;
    background: white;
    cursor: pointer;
    transition: 0.15s;
}

.person-card:hover {
    border-color: #315efb;
    box-shadow: 0 4px 14px rgba(0,0,0,0.06);
}

.person-name {
    font-size: 17px;
    font-weight: bold;
    margin-bottom: 12px;
}

.person-bars {
    display: flex;
    height: 20px;
    border-radius: 10px;
    overflow: hidden;
    background: #eee;
}

.bar-completed {
    background: #38a169;
}

.bar-pending {
    background: #ecc94b;
}

.bar-overdue {
    background: #e53e3e;
}

.person-counts {
    display: flex;
    justify-content: space-between;
    margin-top: 9px;
    font-size: 12px;
}

.projects-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
}

.projects-header h2 {
    margin: 0;
}

.project-card {
    background: white;
    border: 1px solid #dfe4eb;
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 18px;
}

.project-header {
    display: flex;
    justify-content: space-between;
    gap: 15px;
    align-items: flex-start;
}

.project-title {
    font-size: 23px;
    font-weight: bold;
    margin-bottom: 8px;
}

.project-meta {
    color: #64748b;
    margin-bottom: 8px;
}

.project-actions {
    display: flex;
    gap: 7px;
    flex-wrap: wrap;
}

.progress-label {
    font-weight: bold;
    margin: 8px 0 6px;
}

.progress-bar {
    width: 100%;
    height: 9px;
    border-radius: 8px;
    background: #e5e7eb;
    overflow: hidden;
}

.progress-fill {
    height: 100%;
    background: #315efb;
    border-radius: 8px;
}

.badge {
    display: inline-block;
    padding: 5px 9px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
}

.badge-pending {
    background: #fff3cd;
    color: #856404;
}

.badge-completed {
    background: #d1e7dd;
    color: #0f5132;
}

.badge-overdue {
    background: #f8d7da;
    color: #842029;
}

.activity-card {
    border: 1px solid #e0e5ec;
    border-radius: 10px;
    margin-top: 15px;
    overflow: hidden;
}

.activity-header {
    padding: 14px 16px;
    background: #fafbfc;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
}

.activity-main {
    flex: 1;
}

.activity-title {
    font-size: 17px;
    font-weight: bold;
    margin-bottom: 5px;
}

.activity-meta {
    color: #64748b;
    font-size: 13px;
}

.activity-actions {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
}

.activity-progress {
    padding: 0 16px 12px;
    background: #fafbfc;
}

.task-toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    background: white;
    border-top: 1px solid #e5e7eb;
    border-bottom: 1px solid #e5e7eb;
    flex-wrap: wrap;
}

.task-toolbar-left,
.task-toolbar-right {
    display: flex;
    align-items: center;
    gap: 7px;
    flex-wrap: wrap;
}

.task-toolbar select {
    padding: 7px 9px;
    border: 1px solid #cfd6df;
    border-radius: 6px;
    background: white;
}

.task-list {
    padding: 10px 16px 15px;
}

.task-row {
    display: grid;
    grid-template-columns: 35px minmax(200px, 1fr) 150px 120px 105px 80px;
    align-items: center;
    gap: 10px;
    padding: 12px;
    border: 1px solid #e2e7ee;
    border-radius: 8px;
    margin-bottom: 8px;
    background: white;
}

.task-row:hover {
    background: #fafcff;
}

.task-name {
    font-weight: 600;
    word-break: break-word;
}

.task-person {
    color: #475569;
}

.task-date {
    color: #475569;
    font-size: 13px;
}

.task-actions {
    display: flex;
    justify-content: flex-end;
}

.task-edit-btn {
    border: none;
    background: #eef2ff;
    color: #315efb;
    padding: 7px 12px;
    border-radius: 6px;
    font-weight: 600;
}

.task-edit-btn:hover {
    background: #dce5ff;
}

.empty {
    text-align: center;
    padding: 25px;
    color: #64748b;
}

.modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.45);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 100;
    padding: 20px;
}

.modal-overlay.show {
    display: flex;
}

.modal {
    background: white;
    width: 100%;
    max-width: 520px;
    border-radius: 12px;
    padding: 22px;
    max-height: 90vh;
    overflow-y: auto;
}

.modal h2 {
    margin-top: 0;
}

.form-group {
    margin-bottom: 14px;
}

.form-group label {
    display: block;
    margin-bottom: 5px;
    font-size: 13px;
    font-weight: bold;
}

.form-group input,
.form-group select,
.form-group textarea {
    width: 100%;
    padding: 10px;
    border: 1px solid #ccd3dd;
    border-radius: 7px;
    outline: none;
}

.form-group textarea {
    min-height: 90px;
    resize: vertical;
}

.modal-buttons {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 18px;
}

.responsible-row {
    display: flex;
    gap: 8px;
}

.responsible-row select {
    flex: 1;
}

.small-btn {
    padding: 7px 10px;
    border-radius: 6px;
    border: 1px solid #cfd6df;
    background: white;
}

.person-task-modal {
    max-width: 900px;
}

.task-dashboard-row {
    display: grid;
    grid-template-columns: 1fr 150px 120px 100px 80px;
    gap: 10px;
    align-items: center;
    padding: 11px;
    border-bottom: 1px solid #e5e7eb;
}

.task-dashboard-row:first-child {
    font-weight: bold;
    background: #f8fafc;
}

.dashboard-tabs {
    display: flex;
    gap: 7px;
    margin-bottom: 12px;
}

.dashboard-tab {
    border: none;
    padding: 8px 13px;
    border-radius: 7px;
    background: #edf1f6;
}

.dashboard-tab.active {
    background: #315efb;
    color: white;
}

.no-data {
    padding: 15px;
    text-align: center;
    color: #64748b;
}

@media(max-width: 900px) {

    .stats-grid {
        grid-template-columns: repeat(2, 1fr);
    }

    .task-row {
        grid-template-columns: 30px 1fr;
    }

    .task-row > * {
        grid-column: 2;
    }

    .task-row > input[type="checkbox"] {
        grid-column: 1;
        grid-row: 1;
    }

    .project-header,
    .activity-header {
        flex-direction: column;
    }
}

@media(max-width: 600px) {

    .container {
        padding: 12px;
    }

    .stats-grid {
        grid-template-columns: 1fr;
    }

    .header {
        padding: 12px;
    }

    .task-dashboard-row {
        grid-template-columns: 1fr;
    }
}

</style>
</head>

<body>

<header class="header">

    <h1>Team Project Tracker</h1>

    <div class="header-right">

        <button class="secondary"
                onclick="exportExcel()">
            Export Excel
        </button>

        <button class="primary"
                onclick="openProjectModal()">
            + Project
        </button>

    </div>

</header>

<main class="container">

    <section class="dashboard">

        <div class="dashboard-card">

            <h2>Overall Dashboard</h2>

            <div class="stats-grid">

                <div class="stat-card">
                    <div class="stat-title">Projects</div>
                    <div class="stat-number" id="totalProjects">0</div>
                </div>

                <div class="stat-card">
                    <div class="stat-title">Activities</div>
                    <div class="stat-number" id="totalActivities">0</div>
                </div>

                <div class="stat-card">
                    <div class="stat-title">Tasks</div>
                    <div class="stat-number" id="totalTasks">0</div>
                </div>

                <div class="stat-card">
                    <div class="stat-title">Overall Progress</div>
                    <div class="stat-number" id="overallProgress">0%</div>
                </div>

            </div>

        </div>

        <div class="dashboard-card">

            <h2>Responsible Person Dashboard</h2>

            <div id="personDashboard"
                 class="person-dashboard">
            </div>

        </div>

    </section>

    <section>

        <div class="projects-header">

            <h2>Projects</h2>

            <button class="primary"
                    onclick="openProjectModal()">
                + Add Project
            </button>

        </div>

        <div id="projectsContainer"></div>

    </section>

</main>


<!-- PROJECT MODAL -->

<div class="modal-overlay" id="projectModal">

    <div class="modal">

        <h2 id="projectModalTitle">
            Add Project
        </h2>

        <input type="hidden" id="projectId">

        <div class="form-group">

            <label>Project Name</label>

            <input
                type="text"
                id="projectName"
                placeholder="Enter project name">

        </div>

        <div class="form-group">

            <label>Project Owner</label>

            <input
                type="text"
                id="projectOwner"
                placeholder="Project owner">

        </div>

        <div class="form-group">

            <label>Start Date</label>

            <input
                type="date"
                id="projectStart">

        </div>

        <div class="form-group">

            <label>Target Date</label>

            <input
                type="date"
                id="projectTarget">

        </div>

        <div class="form-group">

            <label>Status</label>

            <select id="projectStatus">

                <option value="pending">
                    Pending
                </option>

                <option value="completed">
                    Completed
                </option>

            </select>

        </div>

        <div class="modal-buttons">

            <button class="secondary"
                    onclick="closeModal('projectModal')">
                Cancel
            </button>

            <button class="primary"
                    onclick="saveProject()">
                Save
            </button>

        </div>

    </div>

</div>


<!-- ACTIVITY MODAL -->

<div class="modal-overlay" id="activityModal">

    <div class="modal">

        <h2 id="activityModalTitle">
            Add Activity
        </h2>

        <input type="hidden" id="activityId">
        <input type="hidden" id="activityProjectId">

        <div class="form-group">

            <label>Activity Name</label>

            <input
                type="text"
                id="activityName"
                placeholder="Activity name">

        </div>

        <div class="form-group">

            <label>Description</label>

            <textarea
                id="activityDescription"
                placeholder="Activity description">
            </textarea>

        </div>

        <div class="form-group">

            <label>Responsible Person</label>

            <div class="responsible-row">

                <select id="activityPerson"></select>

                <button
                    class="small-btn"
                    onclick="addNewPerson()">
                    + New
                </button>

            </div>

        </div>

        <div class="form-group">

            <label>Due Date</label>

            <input
                type="date"
                id="activityDueDate">

        </div>

        <div class="modal-buttons">

            <button class="secondary"
                    onclick="closeModal('activityModal')">
                Cancel
            </button>

            <button class="primary"
                    onclick="saveActivity()">
                Save
            </button>

        </div>

    </div>

</div>


<!-- TASK MODAL -->

<div class="modal-overlay" id="taskModal">

    <div class="modal">

        <h2 id="taskModalTitle">
            Add Task
        </h2>

        <input type="hidden" id="taskId">
        <input type="hidden" id="taskProjectId">
        <input type="hidden" id="taskActivityId">

        <div class="form-group">

            <label>Task Name</label>

            <input
                type="text"
                id="taskName"
                placeholder="Task name">

        </div>

        <div class="form-group">

            <label>Responsible Person</label>

            <div class="responsible-row">

                <select id="taskPerson"></select>

                <button
                    class="small-btn"
                    onclick="addNewPerson()">
                    + New
                </button>

            </div>

        </div>

        <div class="form-group">

            <label>Due Date</label>

            <input
                type="date"
                id="taskDueDate">

        </div>

        <div class="form-group">

            <label>Status</label>

            <select id="taskStatus">

                <option value="pending">
                    Pending
                </option>

                <option value="completed">
                    Completed
                </option>

            </select>

        </div>

        <div class="modal-buttons">

            <button class="secondary"
                    onclick="closeModal('taskModal')">
                Cancel
            </button>

            <button class="primary"
                    onclick="saveTask()">
                Save
            </button>

        </div>

    </div>

</div>


<!-- PERSON DASHBOARD MODAL -->

<div class="modal-overlay" id="personModal">

    <div class="modal person-task-modal">

        <h2 id="personModalTitle">
            Person Dashboard
        </h2>

        <div class="dashboard-tabs">

            <button
                class="dashboard-tab active"
                id="tabAll"
                onclick="showPersonTasks('all')">
                All
            </button>

            <button
                class="dashboard-tab"
                id="tabCompleted"
                onclick="showPersonTasks('completed')">
                Completed
            </button>

            <button
                class="dashboard-tab"
                id="tabPending"
                onclick="showPersonTasks('pending')">
                Pending
            </button>

            <button
                class="dashboard-tab"
                id="tabOverdue"
                onclick="showPersonTasks('overdue')">
                Overdue
            </button>

        </div>

        <div id="personTasksList"></div>

        <div class="modal-buttons">

            <button class="secondary"
                    onclick="closeModal('personModal')">
                Close
            </button>

        </div>

    </div>

</div>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
"https://skmvwzqdtderulxwqila.supabase.co";

const SUPABASE_KEY =
"sb_publishable_8lgSbEMhydRR6LtERtMuug_dftc3aTU";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================================================
   GLOBAL DATA
========================================================= */

let projects = [];
let activities = [];
let tasks = [];
let teamMembers = [];

let selectedPerson = "";
let selectedPersonStatus = "all";


/* =========================================================
   INITIAL LOAD
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    loadAllData
);


async function loadAllData() {

    try {

        const [
            projectsResult,
            activitiesResult,
            tasksResult,
            membersResult
        ] = await Promise.all([

            supabaseClient
                .from("projects")
                .select("*")
                .order("created_at", {
                    ascending: false
                }),

            supabaseClient
                .from("activities")
                .select("*")
                .order("created_at", {
                    ascending: true
                }),

            supabaseClient
                .from("tasks")
                .select("*")
                .order("created_at", {
                    ascending: true
                }),

            supabaseClient
                .from("team_members")
                .select("*")
                .eq("active", true)
                .order("name")

        ]);


        if (projectsResult.error)
            throw projectsResult.error;

        if (activitiesResult.error)
            throw activitiesResult.error;

        if (tasksResult.error)
            throw tasksResult.error;

        if (membersResult.error)
            throw membersResult.error;


        projects = projectsResult.data || [];

        activities = activitiesResult.data || [];

        tasks = tasksResult.data || [];

        teamMembers = membersResult.data || [];


        refreshUI();

    }

    catch(error) {

        console.error(error);

        alert(
            "Unable to load the database:\n\n" +
            error.message
        );

    }

}


/* =========================================================
   REFRESH UI
========================================================= */

function refreshUI() {

    renderProjects();

    renderDashboard();

    populatePersonDropdowns();

}


/* =========================================================
   PROJECT RENDER
========================================================= */

function renderProjects() {

    const container =
        document.getElementById(
            "projectsContainer"
        );

    container.innerHTML = "";


    if (projects.length === 0) {

        container.innerHTML = `
            <div class="dashboard-card empty">
                No projects added yet.
            </div>
        `;

        return;
    }


    projects.forEach(project => {

        const projectActivities =
            activities.filter(
                a => a.project_id === project.id
            );


        const projectTasks =
            tasks.filter(
                t => t.project_id === project.id
            );


        const progress =
            calculateProjectProgress(
                project.id
            );


        const card =
            document.createElement("div");

        card.className = "project-card";


        card.innerHTML = `

            <div class="project-header">

                <div>

                    <div class="project-title">
                        ${escapeHtml(project.project_name)}
                    </div>

                    <div class="project-meta">

                        Owner:
                        <strong>
                            ${escapeHtml(project.project_owner || "-")}
                        </strong>

                        &nbsp; | &nbsp;

                        Start:
                        ${project.start_date || "-"}

                        &nbsp; | &nbsp;

                        Target:
                        ${project.target_date || "-"}

                        &nbsp; | &nbsp;

                        <span class="badge badge-${project.status || "pending"}">
                            ${capitalize(project.status || "pending")}
                        </span>

                    </div>

                </div>


                <div class="project-actions">

                    <button
                        class="secondary"
                        onclick="editProject('${project.id}')">
                        Edit
                    </button>

                    <button
                        class="danger"
                        onclick="deleteProject('${project.id}')">
                        Delete
                    </button>

                    <button
                        class="primary"
                        onclick="openActivityModal('${project.id}')">
                        + Activity
                    </button>

                </div>

            </div>


            <div class="progress-label">
                Project Progress: ${progress.toFixed(2)}%
            </div>

            <div class="progress-bar">

                <div
                    class="progress-fill"
                    style="width:${progress}%">
                </div>

            </div>


            <div style="margin-top:8px;color:#64748b;font-size:13px">

                ${projectActivities.length}
                Activities

                &nbsp; | &nbsp;

                ${projectTasks.length}
                Tasks

            </div>


            <div id="activities-${project.id}"></div>

        `;


        container.appendChild(card);


        const activityContainer =
            document.getElementById(
                `activities-${project.id}`
            );


        projectActivities.forEach(
            activity => {

                renderActivity(
                    activity,
                    activityContainer
                );

            }
        );

    });

}


/* =========================================================
   ACTIVITY RENDER
========================================================= */

function renderActivity(
    activity,
    container
) {

    const activityTasks =
        tasks.filter(
            t => t.activity_id === activity.id
        );


    const progress =
        calculateActivityProgress(
            activity.id
        );


    const div =
        document.createElement("div");

    div.className = "activity-card";


    div.innerHTML = `

        <div class="activity-header">

            <div class="activity-main">

                <div class="activity-title">

                    ${escapeHtml(activity.activity_name)}

                </div>

                <div class="activity-meta">

                    Responsible:
                    <strong>
                        ${escapeHtml(
                            activity.responsible_person ||
                            "Not Assigned"
                        )}
                    </strong>

                    &nbsp; | &nbsp;

                    Due:
                    ${activity.due_date || "-"}

                    &nbsp; | &nbsp;

                    Activity Weight:
                    <strong>
                        ${getActivityWeight(activity.project_id).toFixed(2)}%
                    </strong>

                </div>

            </div>


            <div class="activity-actions">

                <button
                    class="secondary"
                    onclick="editActivity('${activity.id}')">
                    Edit
                </button>

                <button
                    class="danger"
                    onclick="deleteActivity('${activity.id}')">
                    Delete
                </button>

                <button
                    class="primary"
                    onclick="openTaskModal(
                        '${activity.project_id}',
                        '${activity.id}'
                    )">
                    + Task
                </button>

            </div>

        </div>


        <div class="activity-progress">

            <div class="progress-label">
                Activity Progress:
                ${progress.toFixed(2)}%
            </div>

========================================================= */

function renderTasks(
    taskArray,
    container
) {

    container.innerHTML = "";


    if (!taskArray.length) {

        container.innerHTML = `
            <div class="empty">
                No tasks found.
            </div>

    taskArray.forEach(task => {

/* =========================================================
   TASK STATUS
========================================================= */

function getTaskStatus(task) {

    if (
        String(task.status || "").toLowerCase()
        === "completed"
    ) {

        return "completed";

    }


    if (
        task.due_date &&
        new Date(task.due_date)
        <
        new Date(
            new Date().setHours(
                0,0,0,0
            )
        )
    ) {

        return "overdue";

    }


    return "pending";

}


/* =========================================================
   PROJECT PROGRESS
=========================================================

   100% project
   divided equally among activities.

   Each activity's weight:
       100 / number of activities

   Each task within activity:
       activity weight / number of tasks

   Completed task = its task weight.

========================================================= */

function calculateProjectProgress(
    projectId
) {

    const projectActivities =
        activities.filter(
            a => a.project_id === projectId
        );


    if (!projectActivities.length)
        return 0;


    let totalProgress = 0;


    const activityWeight =
        100 / projectActivities.length;


    projectActivities.forEach(activity => {

        const activityTasks =
            tasks.filter(
                t =>
                    t.activity_id ===
                    activity.id
            );


        if (!activityTasks.length)
            return;


        const taskWeight =
            activityWeight /
            activityTasks.length;


        activityTasks.forEach(task => {

            if (
                getTaskStatus(task)
                === "completed"
            ) {

                totalProgress += taskWeight;

            }

        });

    });


    return Math.min(
        100,
        totalProgress
    );

}


/* =========================================================
   ACTIVITY PROGRESS
========================================================= */

function calculateActivityProgress(
    activityId
) {

    const activityTasks =
        tasks.filter(
            t => t.activity_id === activityId
        );


    if (!activityTasks.length)
        return 0;


    const completed =
        activityTasks.filter(
            t =>
                getTaskStatus(t)
                === "completed"
        ).length;


    return (
        completed /
        activityTasks.length
    ) * 100;

}


/* =========================================================
   ACTIVITY WEIGHT
========================================================= */

function getActivityWeight(
    projectId
) {

    const count =
        activities.filter(
            a =>
                a.project_id === projectId
        ).length;


    if (!count)
        return 0;


    return 100 / count;

}

    if (!people.length) {

    people.forEach(person => {

            tasks.filter(

                    === "completed"
            ).length;

                    getTaskStatus(t)
                    === "pending"
            ).length;


        const overdue =
            personTasks.filter(
                t =>
                    getTaskStatus(t)
                    === "overdue"
            ).length;


        const total =
            personTasks.length;


        const completedWidth =
            total
                ? completed / total * 100
                : 0;


        const pendingWidth =
            total

                : 0;


        const overdueWidth =
            total
                ? overdue / total * 100
                : 0;


        const card =
            document.createElement("div");

        card.className =

        card.onclick = () =>
            openPersonDashboard(person);

/* =========================================================
   PERSON LIST
========================================================= */

function getAllResponsiblePeople() {

    const set = new Set();


    teamMembers.forEach(member => {

        if (member.name)
            set.add(member.name);

    });


    tasks.forEach(task => {

        if (task.responsible_person)
            set.add(
                task.responsible_person
            );

    });


    activities.forEach(activity => {

        if (activity.responsible_person)
            set.add(
                activity.responsible_person
            );

    });


    return Array.from(set).sort(
        (a,b) =>
            a.localeCompare(b)
    );

}

async function addNewPerson() {

    const name =
        prompt(
            "Enter new responsible person's name:"
        );


    if (!name)
        return;


    const cleanName =
        name.trim();


    if (!cleanName)
        return;


    const alreadyExists =
        teamMembers.some(
            member =>
                member.name.toLowerCase()
                === cleanName.toLowerCase()
        );


    if (alreadyExists) {

        alert(
            "This person already exists."
        );

        return;

    }


    const { error } =
        await supabaseClient
            .from("team_members")
            .insert({

                name: cleanName,

                active: true

            });


    if (error) {

        alert(
            "Unable to add person:\n" +
            error.message
        );

        return;

    }


    await loadAllData();


    document.getElementById(
        "activityPerson"
    ).value = cleanName;


    document.getElementById(
        "taskPerson"
    ).value = cleanName;

}

            "Delete this project and all its activities and tasks?"

    const projectActivities =
        activities.filter(
            a =>
                a.project_id === projectId
        );


    for (
        const activity
        of projectActivities
    ) {

        await supabaseClient
            .from("tasks")
            .delete()
            .eq(
                "activity_id",
                activity.id
            );

    }


    await supabaseClient
        .from("activities")
        .delete()
        .eq(
            "project_id",
            projectId
        );


    const { error } =

            .from("projects")

            ).value || null,

        status:
            document.getElementById(
                "taskStatus"
            ).value,

        updated_at:
            new Date().toISOString()

    };


    if (!data.task_name) {

        alert(
            "Please enter task name."
        );

        return;

    }


    let result;


    if (id) {

        result =
            await supabaseClient
                .from("tasks")
                .update(data)
                .eq("id", id);

    }

    else {

        result =
            await supabaseClient
                .from("tasks")
                .insert(data);

    }


    if (result.error) {

        alert(
            "Unable to save task:\n" +
            result.error.message
        );

        return;

    }


    closeModal("taskModal");

    await loadAllData();

}


/* =========================================================
   CHECKBOX TASK COMPLETION
========================================================= */

async function toggleTaskStatus(
    taskId,
    checked
) {

    const newStatus =
        checked
            ? "completed"
            : "pending";


    const { error } =
        await supabaseClient
            .from("tasks")
            .update({

                status: newStatus,

                updated_at:
                    new Date().toISOString()

            })
            .eq(
                "id",
                taskId
            );


    if (error) {

        alert(
            "Unable to update task:\n" +
            error.message
        );

        return;

    }


    await loadAllData();

}


/* =========================================================
   TASK SORTING
========================================================= */

function sortActivityTasks(
    activityId,
    select
) {

    const taskList =
        document.getElementById(
            `task-list-${activityId}`
        );


    if (!taskList)
        return;


    const rows =
        Array.from(
            taskList.querySelectorAll(
                ".task-row"
            )
        );


    const sortType =
        select.value;


    rows.sort(
        (a,b) => {

            if (
                sortType ===
                "due_asc"
            ) {

                return (
                    (a.dataset.due ||
                        "9999-99-99")
                    .localeCompare(
                        b.dataset.due ||
                        "9999-99-99"
                    )
                );

            }


            if (
                sortType ===
                "due_desc"
            ) {

                return (
                    (b.dataset.due || "")
                    .localeCompare(
                        a.dataset.due || ""
                    )
                );

            }


            if (
                sortType ===
                "name_asc"
            ) {

                return (
                    a.dataset.name
                    .toLowerCase()
                    .localeCompare(
                        b.dataset.name
                        .toLowerCase()
                    )
                );

            }


            if (
                sortType ===
                "name_desc"
            ) {

                return (
                    b.dataset.name
                    .toLowerCase()
                    .localeCompare(
                        a.dataset.name
                        .toLowerCase()
                    )
                );

            }


            if (
                sortType ===
                "person_asc"
            ) {

                return (
                    a.dataset.person
                    .toLowerCase()
                    .localeCompare(
                        b.dataset.person
                        .toLowerCase()
                    )
                );

            }


            if (
                sortType ===
                "person_desc"
            ) {

                return (
                    b.dataset.person
                    .toLowerCase()
                    .localeCompare(
                        a.dataset.person
                        .toLowerCase()
                    )
                );

            }


            if (
                sortType ===
                "status"
            ) {

                const order = {

                    overdue: 1,

                    pending: 2,

                    completed: 3

                };


                return (
                    (order[
                        a.dataset.status
                    ] || 99)
                    -
                    (order[
                        b.dataset.status
                    ] || 99)
                );

            }


            return 0;

        }
    );


    rows.forEach(
        row =>
            taskList.appendChild(row)
    );

}


/* =========================================================
   TASK FILTER
========================================================= */

function filterActivityTasks(
    activityId,
    select
) {

    const activityCard =
        document.getElementById(
            `task-list-${activityId}`
        )?.closest(
            ".activity-card"
        );


    if (!activityCard)
        return;


    const selects =
        activityCard.querySelectorAll(
            ".task-toolbar select"
        );


    const statusFilter =
        selects[0].value;


    const personFilter =
        selects[1].value;


    const rows =
        activityCard.querySelectorAll(
            ".task-row"
        );


    rows.forEach(row => {

        const statusMatch =
            statusFilter === "all" ||
            row.dataset.status ===
            statusFilter;


        const personMatch =
            personFilter === "all" ||
            row.dataset.person ===
            personFilter;


        row.style.display =
            statusMatch &&
            personMatch
                ? "grid"
                : "none";

    });

}


/* =========================================================
   EXCEL EXPORT
========================================================= */

function exportExcel() {

    const exportRows = [];


    tasks.forEach(task => {

        const project =
            projects.find(
                p =>
                    p.id ===
                    task.project_id
            );


        const activity =
            activities.find(
                a =>
                    a.id ===
                    task.activity_id
            );


        exportRows.push({

            "Project":
                project?.project_name || "",

            "Project Owner":
                project?.project_owner || "",

            "Project Status":
                project?.status || "",

            "Project Target":
                project?.target_date || "",

            "Activity":
                activity?.activity_name || "",

            "Activity Responsible":
                activity?.responsible_person || "",

            "Task":
                task.task_name || "",

            "Responsible Person":
                task.responsible_person || "",

            "Due Date":
                task.due_date || "",

            "Status":
                getTaskStatus(task),

            "Activity Progress":
                calculateActivityProgress(
                    task.activity_id
                ).toFixed(2) + "%",

            "Project Progress":
                calculateProjectProgress(
                    task.project_id
                ).toFixed(2) + "%"

        });

    });


    if (!exportRows.length) {

        alert(
            "There is no task data to export."
        );

        return;

    }


    const worksheet =
        XLSX.utils.json_to_sheet(
            exportRows
        );


    const workbook =
        XLSX.utils.book_new();


    XLSX.utils.book_append_sheet(
        workbook,
        worksheet,
        "Project Tracker"
    );


    XLSX.writeFile(
        workbook,
        "Team_Project_Tracker.xlsx"
    );

}


/* =========================================================
   MODAL
========================================================= */

function closeModal(
    modalId
) {

    document.getElementById(
        modalId
    ).classList.remove("show");

}


/* Close when clicking outside */

document.querySelectorAll(
    ".modal-overlay"
).forEach(
    overlay => {

        overlay.addEventListener(
            "click",
            event => {

                if (
                    event.target ===
                    overlay
                ) {

                    overlay.classList.remove(
                        "show"
                    );

                }

            }
        );

    }
);


/* =========================================================
   HELPERS
========================================================= */

function capitalize(value) {

    if (!value)
        return "";

    return (
        value.charAt(0).toUpperCase() +
        value.slice(1)
    );

}


function escapeHtml(value) {

    return String(value || "")
        .replaceAll(
            "&",
            "&amp;"
        )
        .replaceAll(
            "<",
            "&lt;"
        )
        .replaceAll(
            ">",
            "&gt;"
        )
        .replaceAll(
            '"',
            "&quot;"
        )
        .replaceAll(
            "'",
            "&#039;"
        );

}
