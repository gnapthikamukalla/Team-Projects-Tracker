<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Team Projects Tracker</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f4f6f8;
    color: #172033;
}

header {
    background: #ffffff;
    border-bottom: 1px solid #ddd;
    padding: 18px 28px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 20;
}

header h1 {
    margin: 0;
    font-size: 24px;
}

.header-right {
    display: flex;
    gap: 10px;
    align-items: center;
}

.container {
    max-width: 1500px;
    margin: auto;
    padding: 25px;
}

button {
    border: none;
    border-radius: 7px;
    padding: 9px 15px;
    cursor: pointer;
    font-weight: 600;
}

button:hover {
    opacity: 0.88;
}

.btn-primary {
    background: #3563e9;
    color: white;
}

.btn-success {
    background: #198754;
    color: white;
}

.btn-danger {
    background: #dc3545;
    color: white;
}

.btn-light {
    background: #eef2ff;
    color: #243b7a;
}

.btn-warning {
    background: #f59e0b;
    color: white;
}

.dashboard-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
    margin-bottom: 25px;
}

.stat-card {
    background: white;
    border: 1px solid #ddd;
    border-radius: 12px;
    padding: 20px;
}

.stat-title {
    color: #6b7280;
    font-size: 14px;
}

.stat-number {
    font-size: 30px;
    font-weight: bold;
    margin-top: 8px;
}

.section {
    background: white;
    border: 1px solid #ddd;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
}

.section-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    margin-bottom: 15px;
}

.section-header h2 {
    margin: 0;
}

.project-card {
    background: white;
    border: 1px solid #d9dee7;
    border-radius: 12px;
    margin-bottom: 20px;
    overflow: hidden;
}

.project-header {
    padding: 18px;
    border-bottom: 1px solid #e5e7eb;
}

.project-title-row {
    display: flex;
    justify-content: space-between;
    gap: 15px;
    align-items: center;
}

.project-title {
    font-size: 22px;
    font-weight: bold;
}

.project-meta {
    color: #667085;
    margin-top: 7px;
}

.project-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

.progress-label {
    margin-top: 12px;
    font-weight: bold;
}

.progress-container {
    height: 11px;
    background: #e5e7eb;
    border-radius: 20px;
    overflow: hidden;
    margin-top: 7px;
}

.progress-bar {
    height: 100%;
    background: #3563e9;
    border-radius: 20px;
    transition: width .3s;
}

.activity-card {
    margin: 15px;
    border: 1px solid #dce1e8;
    border-radius: 10px;
    background: #fafbfc;
}

.activity-header {
    padding: 15px;
    background: #f3f5f8;
    border-bottom: 1px solid #ddd;
}

.activity-top {
    display: flex;
    justify-content: space-between;
    gap: 15px;
    align-items: flex-start;
}

.activity-name {
    font-size: 18px;
    font-weight: bold;
}

.activity-meta {
    color: #667085;
    margin-top: 5px;
    font-size: 14px;
}

.activity-actions {
    display: flex;
    gap: 7px;
    flex-wrap: wrap;
}

.activity-progress {
    margin-top: 10px;
}

.task-container {
    padding: 12px;
}

.task-row {
    background: white;
    border: 1px solid #e0e4ea;
    border-radius: 9px;
    padding: 12px;
    margin-bottom: 9px;

    display: grid;
    grid-template-columns: 1fr auto;
    gap: 15px;
    align-items: center;
}

.task-main {
    display: flex;
    gap: 12px;
    align-items: flex-start;
}

.task-checkbox {
    width: 18px;
    height: 18px;
    margin-top: 2px;
    cursor: pointer;
}

.task-name {
    font-weight: 600;
}

.task-info {
    font-size: 13px;
    color: #667085;
    margin-top: 5px;
}

.task-actions {
    display: flex;
    gap: 7px;
    flex-wrap: wrap;
    justify-content: flex-end;
}

.status {
    display: inline-block;
    border-radius: 20px;
    padding: 4px 9px;
    font-size: 12px;
    font-weight: bold;
}

.status-pending {
    background: #fff3cd;
    color: #8a5a00;
}

.status-completed {
    background: #d1e7dd;
    color: #146c43;
}

.status-overdue {
    background: #f8d7da;
    color: #b02a37;
}

.person-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
}

.person-card {
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 16px;
    background: white;
    cursor: pointer;
}

.person-card:hover {
    border-color: #3563e9;
    box-shadow: 0 3px 12px rgba(0,0,0,.08);
}

.person-name {
    font-weight: bold;
    font-size: 18px;
}

.person-counts {
    display: flex;
    gap: 7px;
    margin-top: 12px;
    flex-wrap: wrap;
}

.count-box {
    padding: 6px 9px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: bold;
}

.count-completed {
    background: #d1e7dd;
    color: #146c43;
}

.count-pending {
    background: #fff3cd;
    color: #8a5a00;
}

.count-overdue {
    background: #f8d7da;
    color: #b02a37;
}

.dashboard-details {
    margin-top: 20px;
}

.task-list-item {
    background: white;
    border: 1px solid #ddd;
    border-radius: 9px;
    padding: 13px;
    margin-bottom: 9px;

    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
}

.task-list-left {
    flex: 1;
}

.task-list-title {
    font-weight: bold;
}

.task-list-meta {
    color: #667085;
    font-size: 13px;
    margin-top: 5px;
}

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.45);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.modal.show {
    display: flex;
}

.modal-box {
    background: white;
    width: min(650px, 100%);
    max-height: 90vh;
    overflow-y: auto;
    border-radius: 12px;
    padding: 22px;
}

.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
}

.modal-header h3 {
    margin: 0;
}

.form-group {
    margin-bottom: 14px;
}

.form-group label {
    display: block;
    font-weight: 600;
    margin-bottom: 6px;
}

input,
select,
textarea {
    width: 100%;
    padding: 10px;
    border: 1px solid #ccd2dc;
    border-radius: 7px;
    font-family: inherit;
    font-size: 14px;
}

textarea {
    min-height: 90px;
    resize: vertical;
}

.modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 20px;
}

.loading {
    padding: 30px;
    text-align: center;
    color: #667085;
}

.empty {
    padding: 25px;
    text-align: center;
    color: #667085;
}

.toast {
    position: fixed;
    bottom: 25px;
    right: 25px;
    background: #172033;
    color: white;
    padding: 13px 18px;
    border-radius: 8px;
    display: none;
    z-index: 200;
}

.toast.show {
    display: block;
}

@media(max-width: 1000px) {
    .dashboard-grid,
    .person-grid {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media(max-width: 700px) {
    .dashboard-grid,
    .person-grid {
        grid-template-columns: 1fr;
    }

    .project-title-row,
    .activity-top,
    .task-row {
        grid-template-columns: 1fr;
        flex-direction: column;
        align-items: stretch;
    }

    .task-actions {
        justify-content: flex-start;
    }
}

</style>
</head>

<body>

<header>

    <h1>Team Projects Tracker</h1>

    <div class="header-right">
        <button class="btn-light" onclick="showDashboard()">
            Dashboard
        </button>

        <button class="btn-primary" onclick="openProjectModal()">
            + Project
        </button>
    </div>

</header>

<div class="container">

    <!-- SUMMARY -->

    <div class="dashboard-grid">

        <div class="stat-card">
            <div class="stat-title">Projects</div>
            <div class="stat-number" id="totalProjects">0</div>
        </div>

        <div class="stat-card">
            <div class="stat-title">Activities</div>
            <div class="stat-number" id="totalActivities">0</div>
        </div>

        <div class="stat-card">
            <div class="stat-title">Tasks</div>
            <div class="stat-number" id="totalTasks">0</div>
        </div>

        <div class="stat-card">
            <div class="stat-title">Overall Progress</div>
            <div class="stat-number" id="overallProgress">0%</div>
        </div>

    </div>

    <!-- RESPONSIBILITY DASHBOARD -->

    <div class="section">

        <div class="section-header">

            <h2>Responsibility Dashboard</h2>

            <button class="btn-success" onclick="exportExcel()">
                Export Excel
            </button>

        </div>

        <div id="peopleDashboard" class="person-grid"></div>

        <div id="responsibilityDetails" class="dashboard-details"></div>

    </div>

    <!-- PROJECTS -->

    <div class="section">

        <div class="section-header">
            <h2>Projects</h2>

            <button class="btn-primary" onclick="openProjectModal()">
                + Add Project
            </button>
        </div>

        <div id="projectsContainer">
            <div class="loading">Loading...</div>
        </div>

    </div>

</div>


<!-- =====================================================
     PROJECT MODAL
===================================================== -->

<div class="modal" id="projectModal">

    <div class="modal-box">

        <div class="modal-header">
            <h3 id="projectModalTitle">Add Project</h3>

            <button class="btn-light"
                    onclick="closeModal('projectModal')">
                X
            </button>
        </div>

        <input type="hidden" id="projectId">

        <div class="form-group">
            <label>Project Name</label>
            <input id="projectName">
        </div>

        <div class="form-group">
            <label>Project Owner</label>
            <select id="projectOwner"></select>
        </div>

        <div class="form-group">
            <label>Start Date</label>
            <input type="date" id="projectStartDate">
        </div>

        <div class="form-group">
            <label>Target Date</label>
            <input type="date" id="projectTargetDate">
        </div>

        <div class="form-group">
            <label>Project Status</label>

            <select id="projectStatus">

                <option value="Pending">
                    Pending
                </option>

                <option value="Completed">
                    Completed
                </option>

            </select>

        </div>

        <div class="modal-actions">

            <button class="btn-light"
                    onclick="closeModal('projectModal')">
                Cancel
            </button>

            <button class="btn-primary"
                    onclick="saveProject()">
                Save
            </button>

        </div>

    </div>

</div>


<!-- =====================================================
     ACTIVITY MODAL
===================================================== -->

<div class="modal" id="activityModal">

    <div class="modal-box">

        <div class="modal-header">

            <h3 id="activityModalTitle">
                Add Activity
            </h3>

            <button class="btn-light"
                    onclick="closeModal('activityModal')">
                X
            </button>

        </div>

        <input type="hidden" id="activityId">
        <input type="hidden" id="activityProjectId">

        <div class="form-group">

            <label>Activity Name</label>

            <input id="activityName">

        </div>

        <div class="form-group">

            <label>Description</label>

            <textarea id="activityDescription"></textarea>

        </div>

        <div class="form-group">

            <label>Responsible Person</label>

            <select id="activityResponsible"></select>

        </div>

        <div class="form-group">

            <label>Due Date</label>

            <input type="date" id="activityDueDate">

        </div>

        <div class="modal-actions">

            <button class="btn-light"
                    onclick="closeModal('activityModal')">
                Cancel
            </button>

            <button class="btn-primary"
                    onclick="saveActivity()">
                Save
            </button>

        </div>

    </div>

</div>


<!-- =====================================================
     TASK MODAL
===================================================== -->

<div class="modal" id="taskModal">

    <div class="modal-box">

        <div class="modal-header">

            <h3 id="taskModalTitle">
                Add Task
            </h3>

            <button class="btn-light"
                    onclick="closeModal('taskModal')">
                X
            </button>

        </div>

        <input type="hidden" id="taskId">
        <input type="hidden" id="taskProjectId">
        <input type="hidden" id="taskActivityId">

        <div class="form-group">

            <label>Task Name</label>

            <input id="taskName">

        </div>

        <div class="form-group">

            <label>Responsible Person</label>

            <select id="taskResponsible"></select>

        </div>

        <div class="form-group">

            <label>Due Date</label>

            <input type="date" id="taskDueDate">

        </div>

        <div class="form-group">

            <label>Status</label>

            <select id="taskStatus">

                <option value="Pending">
                    Pending
                </option>

                <option value="Completed">
                    Completed
                </option>

            </select>

        </div>

        <div class="modal-actions">

            <button class="btn-light"
                    onclick="closeModal('taskModal')">
                Cancel
            </button>

            <button class="btn-primary"
                    onclick="saveTask()">
                Save
            </button>

        </div>

    </div>

</div>


<!-- =====================================================
     PERSON MODAL
===================================================== -->

<div class="modal" id="personModal">

    <div class="modal-box">

        <div class="modal-header">

            <h3>Add Responsible Person</h3>

            <button class="btn-light"
                    onclick="closeModal('personModal')">
                X
            </button>

        </div>

        <div class="form-group">

            <label>Person Name</label>

            <input id="newPersonName"
                   placeholder="Enter name">

        </div>

        <div class="form-group">

            <label>Email (optional)</label>

            <input id="newPersonEmail"
                   type="email"
                   placeholder="Enter email">

        </div>

        <div class="modal-actions">

            <button class="btn-light"
                    onclick="closeModal('personModal')">
                Cancel
            </button>

            <button class="btn-primary"
                    onclick="addPerson()">
                Add Person
            </button>

        </div>

    </div>

</div>


<div class="toast" id="toast"></div>


<script>

/* =====================================================
   SUPABASE CONNECTION
===================================================== */

const SUPABASE_URL =
"https://skmvwzqdtderulxwqila.supabase.co";

const SUPABASE_KEY =
"PASTE_YOUR_PUBLISHABLE_KEY_HERE";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =====================================================
   GLOBAL DATA
===================================================== */

let projects = [];
let activities = [];
let tasks = [];
let people = [];

let selectedDashboardPerson = null;
let selectedDashboardStatus = null;


/* =====================================================
   START
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    loadEverything
);


async function loadEverything() {

    try {

        await loadPeople();

        await loadProjects();

        await loadActivities();

        await loadTasks();

        renderEverything();

    }
    catch(error) {

        console.error(error);

        alert(
            "Unable to load the database: " +
            error.message
        );

    }

}


/* =====================================================
   PEOPLE
===================================================== */

async function loadPeople() {

    const { data, error } =
        await supabaseClient
            .from("team_members")
            .select("*")
            .eq("active", true)
            .order("name");

    if(error) {

        console.error(error);

        people = [
            {name:"Manigandan"},
            {name:"Satyam"},
            {name:"Tharani"},
            {name:"Gnapthika"}
        ];

        return;
    }

    people = data || [];

}


function fillPersonDropdown(selectId, selectedValue = "") {

    const select =
        document.getElementById(selectId);

    if(!select) return;

    select.innerHTML = "";

    people.forEach(person => {

        const option =
            document.createElement("option");

        option.value = person.name;
        option.textContent = person.name;

        if(person.name === selectedValue) {
            option.selected = true;
        }

        select.appendChild(option);

    });

    const addOption =
        document.createElement("option");

    addOption.value = "__ADD_NEW__";
    addOption.textContent =
        "+ Add New Person";

    select.appendChild(addOption);

}


function handlePersonDropdown(selectId) {

    const select =
        document.getElementById(selectId);

    if(!select) return;

    if(select.value === "__ADD_NEW__") {

        select.value = "";

        document.getElementById(
            "newPersonName"
        ).value = "";

        document.getElementById(
            "newPersonEmail"
        ).value = "";

        document
            .getElementById("personModal")
            .classList.add("show");

    }

}


async function addPerson() {

    const name =
        document
            .getElementById("newPersonName")
            .value.trim();

    const email =
        document
            .getElementById("newPersonEmail")
            .value.trim();

    if(!name) {

        alert("Please enter a person name.");

        return;
    }

    const { data, error } =
        await supabaseClient
            .from("team_members")
            .insert({
                name: name,
                email: email || null
            })
            .select()
            .single();

    if(error) {

        alert(error.message);

        return;
    }

    people.push(data);

    closeModal("personModal");

    fillAllPersonDropdowns(name);

    showToast("Person added successfully.");

}


function fillAllPersonDropdowns(selectedName = "") {

    fillPersonDropdown(
        "projectOwner",
        selectedName
    );

    fillPersonDropdown(
        "activityResponsible",
        selectedName
    );

    fillPersonDropdown(
        "taskResponsible",
        selectedName
    );

}


/* =====================================================
   PROJECTS
===================================================== */

async function loadProjects() {

    const { data, error } =
        await supabaseClient
            .from("projects")
            .select("*")
            .order("created_at", {
                ascending: false
            });

    if(error) throw error;

    projects = data || [];

}


async function saveProject() {

    const id =
        document.getElementById(
            "projectId"
        ).value;

    const project = {

        project_name:
            document.getElementById(
                "projectName"
            ).value.trim(),

        project_owner:
            document.getElementById(
                "projectOwner"
            ).value,

        start_date:
            document.getElementById(
                "projectStartDate"
            ).value || null,

        target_date:
            document.getElementById(
                "projectTargetDate"
            ).value || null,

        status:
            document.getElementById(
                "projectStatus"
            ).value

    };

    if(!project.project_name) {

        alert("Please enter project name.");

        return;
    }

    let result;

    if(id) {

        result =
            await supabaseClient
                .from("projects")
                .update(project)
                .eq("id", id);

    }
    else {

        result =
            await supabaseClient
                .from("projects")
                .insert(project);

    }

    if(result.error) {

        alert(result.error.message);

        return;
    }

    closeModal("projectModal");

    await loadEverything();

    showToast("Project saved successfully.");

}


function openProjectModal(id = null) {

    fillAllPersonDropdowns();

    document.getElementById(
        "projectModal"
    ).classList.add("show");

    if(id) {

        const project =
            projects.find(
                p => p.id === id
            );

        if(!project) return;

        document.getElementById(
            "projectModalTitle"
        ).textContent =
            "Edit Project";

        document.getElementById(
            "projectId"
        ).value = project.id;

        document.getElementById(
            "projectName"
        ).value =
            project.project_name || "";

        document.getElementById(
            "projectStartDate"
        ).value =
            project.start_date || "";

        document.getElementById(
            "projectTargetDate"
        ).value =
            project.target_date || "";

        document.getElementById(
            "projectStatus"
        ).value =
            project.status || "Pending";

        fillPersonDropdown(
            "projectOwner",
            project.project_owner
        );

    }
    else {

        document.getElementById(
            "projectModalTitle"
        ).textContent =
            "Add Project";

        document.getElementById(
            "projectId"
        ).value = "";

        document.getElementById(
            "projectName"
        ).value = "";

        document.getElementById(
            "projectStartDate"
        ).value = "";

        document.getElementById(
            "projectTargetDate"
        ).value = "";

        document.getElementById(
            "projectStatus"
        ).value = "Pending";

        fillPersonDropdown(
            "projectOwner",
            "Gnapthika"
        );

    }

}


/* =====================================================
   DELETE PROJECT
===================================================== */

async function deleteProject(id) {

    if(!confirm(
        "Delete this project and all its activities/tasks?"
    )) return;

    await supabaseClient
        .from("tasks")
        .delete()
        .eq("project_id", id);

    await supabaseClient
        .from("activities")
        .delete()
        .eq("project_id", id);

    const { error } =
        await supabaseClient
            .from("projects")
            .delete()
            .eq("id", id);

    if(error) {

        alert(error.message);

        return;
    }

    await loadEverything();

    showToast("Project deleted.");

}


/* =====================================================
   ACTIVITIES
===================================================== */

async function loadActivities() {

    const { data, error } =
        await supabaseClient
            .from("activities")
            .select("*")
            .order("created_at");

    if(error) throw error;

    activities = data || [];

}


function openActivityModal(
    projectId,
    activityId = null
) {

    fillAllPersonDropdowns();

    document.getElementById(
        "activityProjectId"
    ).value = projectId;

    document.getElementById(
        "activityModal"
    ).classList.add("show");

    if(activityId) {

        const activity =
            activities.find(
                a => a.id === activityId
            );

        document.getElementById(
            "activityModalTitle"
        ).textContent =
            "Edit Activity";

        document.getElementById(
            "activityId"
        ).value =

/* =====================================================
   STATUS
===================================================== */

function getTaskStatus(task) {

    if(task.status === "Completed") {

        return "Completed";

    }

    if(
        task.due_date &&
        task.due_date <
        getToday()
    ) {

        return "Overdue";

    }

    return "Pending";

}


function getToday() {

    const d = new Date();

    return d.toISOString().split("T")[0];

}


/* =====================================================
   PROJECT PROGRESS
===================================================== */

/*
    PROJECT = 100%

    Example:

    4 activities

    Each activity =
    100 / 4 = 25%

    If Activity 1 has 5 tasks:

    Each task =
    25 / 5 = 5%

    3 completed =
    15% project progress
*/

function calculateProjectProgress(
    projectId
) {

    const projectActivities =
        activities.filter(
            a => a.project_id === projectId
        );

    if(projectActivities.length === 0) {

        return 0;

    }

    let progress = 0;

    const activityWeight =
        100 / projectActivities.length;

    projectActivities.forEach(activity => {

        const activityTasks =
            tasks.filter(
                t =>
                    t.activity_id ===
                    activity.id
            );

        if(activityTasks.length === 0) {

            return;

        }

        const completed =
            activityTasks.filter(
                t => t.status === "Completed"
            ).length;

        const taskWeight =
            activityWeight /
            activityTasks.length;

        progress +=
            completed * taskWeight;

    });

    return Math.round(
        progress * 100
    ) / 100;

}


/* =====================================================
   ACTIVITY PROGRESS
===================================================== */

function calculateActivityProgress(
    activityId
) {

    const activityTasks =
        tasks.filter(
            t => t.activity_id === activityId
        );

    if(activityTasks.length === 0) {

        return 0;

    }

    const completed =
        activityTasks.filter(
            t => t.status === "Completed"
        ).length;

    return Math.round(
        completed /
        activityTasks.length *
        100
    );

}

/* =====================================================
   EXCEL EXPORT
===================================================== */

function exportExcel() {

    const rows = [];

    tasks.forEach(task => {

        const project =
            projects.find(
                p => p.id === task.project_id
            );

        const activity =
            activities.find(
                a => a.id === task.activity_id
            );

        rows.push({

            Project:
                project?.project_name || "",

            ProjectOwner:
                project?.project_owner || "",

            ProjectStatus:
                project?.status || "",

            Activity:
                activity?.activity_name || "",

            ActivityResponsible:
                activity?.responsible_person || "",

            Task:
                task.task_name || "",

            ResponsiblePerson:
                task.responsible_person || "",

            DueDate:
                task.due_date || "",

            Status:
                getTaskStatus(task),

            RawStatus:
                task.status || "",

            ProjectProgress:
                project
                ? calculateProjectProgress(
                    project.id
                ) + "%"
                : ""

        });

    });


    if(rows.length === 0) {

        alert("There are no tasks to export.");

        return;

    }


    const worksheet =
        XLSX.utils.json_to_sheet(rows);

    const workbook =
        XLSX.utils.book_new();

    XLSX.utils.book_append_sheet(
        workbook,
        worksheet,
        "Project Tracker"
    );

    XLSX.writeFile(
        workbook,
        "Team_Project_Tracker.xlsx"
    );

}

            const modal =
                document.getElementById(id);

            if(event.target === modal) {

                modal.classList.remove("show");

            }

        });

    }
);


/* =====================================================
   TOAST
===================================================== */

function showToast(message) {

    const toast =
        document.getElementById("toast");

    toast.textContent =
        message;

    toast.classList.add("show");

    setTimeout(
        () =>
            toast.classList.remove("show"),
        2500
    );

}


/* =====================================================
   HTML ESCAPE
===================================================== */

function escapeHtml(value) {

    if(value === null ||
       value === undefined) {

        return "";

    }

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}
